[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
euclid = "0.22"
wherror = "2"
error-stack = "0.7"
rstest = "0.25"
image = "0.25"
imageproc = "0.25"
derive_more = { version = "2", features = ["debug"] }
rodio = "0.22"
rayon = "1.10"
ctrlc = "3"
eframe = "0.31"
egui = "0.31"
dirs = "6"
clap = { version = "4", features = ["derive"] }
